services:
  - type: web
    name: nova-assist-ai-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_MODEL_FAST
        value: gemini-2.5-flash-lite
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: BASIC_FREE_COUPON
        value: NOVA-BASIC-FREE
